<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"
      integrity="sha384-wziAfh6b/qT+3LrqebF9WeK4+J5sehS6FA10J1t3a866kJ/fvU5UwofWnQyzLtwu"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css"
      integrity="sha384-/rJKQnzOkEo+daG0jMjU1IwwY9unxt1NBw3Ef2fmOJ3PW/TfAg2KXVoWwMZQZtw9"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Manrope&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/global.css" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <link rel="stylesheet" href="src/css/list.css" />
    <link rel="stylesheet" href="src/css/profile.css" />
    <title data-i18n="reset-password">Reset password</title>
    <link
      rel="icon"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/icons/lock-fill.svg"
      type="image/svg+xml"
    />
    <meta name="robots" content="noindex, nofollow" />
    <script type="module" src="src/js/common/effects.js"></script>
    <script type="module" src="src/js/common/toast.js"></script>
    <script type="module" src="src/js/profile/reset.js"></script>
    <script type="module" src="src/js/common/appworker.js"></script>
    <script type="module" src="src/js/common/i18n.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
  </head>

  <body class="theme-default mb-5 pb-4">
    <a href="#main-content" class="skip-link" data-i18n="skip"
      >Skip to main content</a
    >
    <header>
      <nav
        id="navbar"
        class="navbar navbar-expand-lg fixed-top d-flex align-items-end"
      >
        <section class="container-fluid d-flex align-items-center">
          <button
            class="navbar-toggler-text fs-2 d-lg-none text-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarColor"
            aria-controls="navbarColor"
            aria-expanded="false"
            aria-label="Toggle color themes"
            data-i18n="colors"
            data-i18n-attr="aria-label:colors-aria"
          >
            Colors ▼
          </button>
          <div class="collapse navbar-collapse" id="navbarColor">
            <ul class="navbar-nav">
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  data-theme="light"
                  aria-label="Light Mode"
                  data-i18n="light-mode"
                  data-i18n-attr="aria-label:light-mode-aria"
                >
                  Light Mode
                </button>
              </li>
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  data-theme="dark"
                  aria-label="Dark Mode"
                  data-i18n="dark-mode"
                  data-i18n-attr="aria-label:dark-mode-aria"
                >
                  Dark Mode
                </button>
              </li>
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  data-theme="default"
                  aria-label="Default Mode"
                  data-i18n="default-mode"
                  data-i18n-attr="aria-label:default-mode-aria"
                >
                  Default
                </button>
              </li>
            </ul>
          </div>

          <button
            class="navbar-toggler-text fs-2 d-lg-none text-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
            data-i18n="pages"
            data-i18n-attr="aria-label:nav-toggle-aria"
          >
            Pages ▼
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarNav"
          >
            <ul class="navbar-nav ms-lg-4">
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./index.html"
                  aria-label="Go to home"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n="home"
                  data-i18n-attr="aria-label:home-aria"
                  >Home</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./profile.html"
                  aria-label="Go to account"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n="account"
                  data-i18n-attr="aria-label:account-aria"
                  >Account</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./list.html"
                  aria-label="Go to list"
                  data-i18n="list"
                  data-i18n-attr="aria-label:list-aria"
                  >List</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./weather.html"
                  aria-label="Go to forecast"
                  data-i18n="weather"
                  data-i18n-attr="aria-label:weather-aria"
                  >Forecast</a
                >
              </li>
            </ul>
          </div>
        </section>
      </nav>
    </header>
    <main
      id="main-content"
      class="container mt-5 pt-5 d-flex flex-column align-items-center justify-content-center min-vh-100"
    >
      <form
        class="my-5 p-0 container item-input col-12 col-md-8 col-lg-6 d-flex flex-column justify-content-center align-items-center"
        id="resetForm"
      >
        <h1 class="text-center" data-i18n="reset-password">Reset password</h1>
        <div
          id="list-form"
          class="row p-0 mb-3 w-100 d-flex justify-content-around align-items-center"
        >
          <div class="col-10 col-md-8 my-2">
            <input
              type="password"
              class="form-control"
              id="newPass"
              placeholder="New Password"
              aria-label="Type your new password"
              aria-describedby="new-pass-conditions"
              data-i18n-attr="aria-label:new-pass-aria;placeholder:new-pass-placeholder"
            />
            <span
              id="new-pass-conditions"
              class="d-flex text-start conditions"
              data-i18n="conditions"
              >At least 8 characters long with uppercase, lowercase, number, and
              special character</span
            >
          </div>
          <div class="col-10 col-md-8 my-2">
            <input
              type="password"
              class="form-control"
              id="confirmPass"
              placeholder="Confirm Password"
              aria-label="Confirm your new password"
              data-i18n-attr="aria-label:confirm-pass-aria;placeholder:confirm-pass-placeholder"
            />
          </div>
        </div>
        <div class="col-6 d-flex justify-content-center align-items-center">
          <button
            type="submit"
            class="btn btn-sm px-0 filter-btn text-center mb-3"
            id="resetBtn"
            aria-label="Submit new password"
            data-i18n="reset-button"
            data-i18n-attr="aria-label:submit-pass-aria"
          >
            Reset Password
          </button>
        </div>
      </form>
    </main>
    <p class="recaptcha-attribution text-center mb-3">
      This site is protected by reCAPTCHA and the Google
      <a
        href="https://policies.google.com/privacy"
        target="_blank"
        rel="noopener noreferrer"
        >Privacy Policy</a
      >
      and
      <a
        href="https://policies.google.com/terms"
        target="_blank"
        rel="noopener noreferrer"
        >Terms of Service</a
      >
      apply.
    </p>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  </body>
</html>
