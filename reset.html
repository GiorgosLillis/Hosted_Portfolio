<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.6/dist/purify.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Manrope&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/global.css" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <link rel="stylesheet" href="src/css/list.css" />
    <link rel="stylesheet" href="src/css/profile.css" />
    <title>Reset password</title>
    <link
      rel="icon"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/icons/lock-fill.svg"
      type="image/svg+xml"
    />
    <meta name="robots" content="noindex, nofollow" />
    <script type="module" src="src/js/common/effects.js"></script>
    <script type="module" src="src/js/common/toast.js"></script>
    <script type="module" src="src/js/profile/reset.js"></script>
  </head>

  <body class="theme-default mb-5 pb-4">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
      <nav
        id="navbar"
        class="navbar navbar-expand-lg fixed-top d-flex align-items-end"
      >
        <section class="container-fluid d-flex align-items-center">
          <button
            class="navbar-toggler-text fs-2 d-lg-none text-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarColor"
            aria-controls="navbarColor"
            aria-expanded="false"
            aria-label="Color Themes Toggle"
          >
            Colors ▼
          </button>
          <div class="collapse navbar-collapse" id="navbarColor">
            <ul class="navbar-nav">
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  onclick="setTheme('light')"
                  aria-label="Light Mode"
                >
                  Light Mode
                </button>
              </li>
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  onclick="setTheme('dark')"
                  aria-label="Dark Mode"
                >
                  Dark Mode
                </button>
              </li>
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  onclick="setTheme('default')"
                  aria-label="Default Mode"
                >
                  Default
                </button>
              </li>
            </ul>
          </div>

          <button
            class="navbar-toggler-text fs-2 d-lg-none text-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            Pages ▼
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarNav"
          >
            <ul class="navbar-nav ms-lg-4">
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./index.html"
                  aria-label="Go to home"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Home</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./profile.html"
                  aria-label="Go to profile"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Profile</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./list.html"
                  aria-label="Go to list"
                  >List</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./weather.html"
                  aria-label="Go to weather"
                  >Weather</a
                >
              </li>
            </ul>
          </div>
        </section>
      </nav>
    </header>
    <main
      id="main-content"
      class="container mt-5 pt-5 d-flex flex-column align-items-center justify-content-center min-vh-100"
    >
      <form
        class="my-5 p-0 container item-input col-12 col-md-8 col-lg-6 d-flex flex-column justify-content-center align-items-center"
        id="resetForm"
      >
        <h1 class="text-center">Reset password</h1>
        <div
          id="list-form"
          class="row p-0 mb-3 w-100 d-flex justify-content-around align-items-center"
        >
          <div class="col-10 col-md-8 my-2">
            <input
              type="password"
              class="form-control"
              id="newPass"
              placeholder="New Password"
              aria-label="Type your new password"
              aria-describedby="new-pass-conditions"
            />
            <span id="new-pass-conditions" class="d-flex text-start conditions"
              >At least 8 characters long with uppercase, lowercase, number, and
              special character</span
            >
          </div>
          <div class="col-10 col-md-8 my-2">
            <input
              type="password"
              class="form-control"
              id="confirmPass"
              placeholder="Confirm Password"
              aria-label="Confirm your new password"
            />
          </div>
        </div>
        <div class="col-6 d-flex justify-content-center align-items-center">
          <button
            type="submit"
            class="btn btn-sm px-0 filter-btn text-center mb-3"
            id="resetBtn"
            aria-label="Submit new password"
          >
            Reset Password
          </button>
        </div>
      </form>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  </body>
</html>
