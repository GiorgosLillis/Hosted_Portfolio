version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # A dependency goes into the first group it matches, so the ones that must move together come first
      react:
        patterns: ["react", "react-dom"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Prisma 8 has a different CLI (no generate or migrate), stay on 7.x until that is dealt with on purpose
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
