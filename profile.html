        <button

          data-bs-toggle="collapse"

          aria-expanded="false"
          aria-label="Toggle color themes"
          data-i18n="colors"
          data-i18n-attr="aria-label:colors-aria"
        >
          Colors ▼
        </button>

          <ul class="navbar-nav">
            <li class="nav-item navbar-brand">
              <button

                class="btn fs-1"
                data-theme="light"

            </li>

                data-theme="default"

                data-i18n="default-mode"
                data-i18n-attr="aria-label:default-mode-aria"
              >
                Default
              </button>
            </li>
          </ul>
        </div>
        <button
          class="navbar-toggler-text fs-2 d-lg-none text-button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
          data-i18n="pages"
          data-i18n-attr="aria-label:nav-toggle-aria"
        >
          Pages ▼
        </button>

            <li class="nav-item navbar-brand">

            </li>
            <li class="nav-item navbar-brand">
              <a
                class="nav-link fs-1"
                href="./list.html"
                aria-label="Go to list"
                data-i18n="list"
                data-i18n-attr="aria-label:list-aria"
                >List</a
              >
            </li>
            <li class="nav-item navbar-brand">
              <a
                class="nav-link fs-1"
