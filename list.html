    <script

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title data-i18n="shopping">SHOPPING LIST</title>

      type="image/svg+xml"
    />

    <meta
      name="title"
      content="Shopping List App - Manage Your Groceries Easily"
    />
    <meta
      name="description"
      content="A simple and intuitive web-based shopping list application to help you keep track of your groceries and daily needs. Save, reset, download, and upload your lists."
    />
    <meta
      name="keywords"
      content="shopping list, groceries, to-do list, web app, list manager, online shopping list"
    />
    <meta name="author" content="Giorgos Lillis" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="public/backgrounds/list-preview.jpg" />
    <meta property="og:url" content="https://www.giorgoslillis.com/list.html" />
    <meta
      property="og:title"
      content="Shopping List App - Manage Your Groceries Easily"
    />
    <meta
      property="og:description"
      content="A simple and intuitive web-based shopping list application to help you keep track of your groceries and daily needs. Save, reset, download, and upload your lists."
    />
  </head>

  <body class="theme-default mb-5 pb-4">
    <a href="#main-content" class="skip-link" data-i18n="skip"
      >Skip to main content</a
    >
    <header>
      <nav
        id="navbar"
        class="navbar navbar-expand-lg fixed-top d-flex align-items-end"
      >
        <section class="container-fluid">
          <button
            class="navbar-toggler-text fs-2 d-lg-none text-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarColor"
            aria-controls="navbarColor"
            aria-expanded="false"
            aria-label="Toggle color themes"
            data-i18n="colors"
            data-i18n-attr="aria-label:colors-aria"
          >
            Colors ▼
          </button>
          <div class="collapse navbar-collapse" id="navbarColor">
            <ul class="navbar-nav">
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  data-theme="light"
                  aria-label="Light Mode"
                  data-i18n="light-mode"
                  data-i18n-attr="aria-label:light-mode-aria"
                >
                  Light Mode
                </button>
              </li>
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  data-theme="dark"
                  aria-label="Dark Mode"
                  data-i18n="dark-mode"
                  data-i18n-attr="aria-label:dark-mode-aria"
                >
                  Dark Mode
                </button>
              </li>
              <li class="nav-item navbar-brand">
                <button
                  type="button"
                  class="btn fs-1"
                  data-theme="default"
                  aria-label="Default Mode"
                  data-i18n="default-mode"
                  data-i18n-attr="aria-label:default-mode-aria"
                >
                  Default
                </button>
              </li>
            </ul>
          </div>
          <button
            class="navbar-toggler-text fs-2 d-lg-none text-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
            data-i18n="pages"
            data-i18n-attr="aria-label:nav-toggle-aria"
          >
            Pages ▼
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarNav"
          >
            <ul class="navbar-nav ms-lg-4">
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./profile.html"
                  aria-label="Go to account"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n="account"
                  data-i18n-attr="aria-label:account-aria"
                  >Account</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./list.html"
                  aria-label="Go to list"
                  data-i18n="list"
                  data-i18n-attr="aria-label:list-aria"
                  >List</a
                >
              </li>
              <li class="nav-item navbar-brand">
                <a
                  class="nav-link fs-1"
                  href="./weather.html"
                  aria-label="Go to forecast"
                  data-i18n="weather"
                  data-i18n-attr="aria-label:weather-aria"
                  >Forecast</a
                >
              </li>
            </ul>
          </div>
        </section>
      </nav>
    </header>

    <main
      id="main-content"
      class="container mt-5 pt-5 d-flex flex-column align-items-center justify-content-center"
      data-aos="fade-in"
      data-aos-duration="2000"
    >
      <p id="logStatus" class="text-center mt-lg-4 mt-xl-5 fs-2"></p>
      <form
        class="my-5 p-0 item-input container col-12 col-md-8 col-lg-6 d-flex flex-column justify-content-center align-items-center"
      >
        <h1 class="p-0 mb-4 text-center" data-i18n="shopping">SHOPPING LIST</h1>
        <div
          class="row p-0 mb-3 w-100 d-flex justify-content-around align-items-center"
          id="list-form"
        >
          <div class="col-6 mb-3">
            <label class="form-label mb-0" for="category"
              ><span class="h2" data-i18n="category">Category</span></label
            >
            <select
              class="form-select"
              id="category"
              aria-label="Select Category"
              data-i18n-attr="aria-label:select-category-aria"
            >
              <option value="" data-i18n="select-category">
                Select Category
              </option>
              <option value="Produce" data-i18n="produce">Produce</option>
              <option value="Dairy" data-i18n="dairy">Dairy</option>
              <option value="Meat" data-i18n="meat">Meat</option>
              <option value="Seafood" data-i18n="seafood">Seafood</option>
              <option value="Bakery" data-i18n="bakery">Bakery</option>
              <option value="Pantry" data-i18n="pantry">Pantry</option>
              <option value="Frozen" data-i18n="frozen">Frozen</option>
              <option value="Beverages" data-i18n="beverages">Beverages</option>
              <option value="Snacks" data-i18n="snacks">Snacks</option>
              <option value="Household" data-i18n="household">Household</option>
              <option value="Personal Care" data-i18n="personal">
                Personal Care
              </option>
              <option value="Other" data-i18n="other">Other</option>
            </select>
          </div>
          <div class="col-6 mb-3">
            <label for="item" class="form-label mb-0"
              ><span class="h2" data-i18n="cart">Item on cart</span></label
            >
            <input
              type="text"
              class="form-control"
              id="item"
              placeholder="Write your item here"
              aria-label="Select Item on cart"
              data-i18n-attr="aria-label:cart-aria;placeholder:cart-placeholder"
            />
          </div>
          <div class="col-6 col-md-3 mb-3">
            <label for="quantity" class="form-label mb-0"
              ><span class="h2" data-i18n="quantity">Quantity</span></label
            >
            <input
              type="number"
              class="form-control"
              id="quantity"
              aria-label="Select Quantity"
              placeholder="e.g. 2.5"
              min="0"
              step="0.01"
              data-i18n-attr="aria-label:quantity-aria;placeholder:quantity-placeholder"
            />
          </div>
          <div class="col-6 col-md-3 mb-3">
            <label for="unit" class="form-label mb-0"
              ><span class="h2" data-i18n="unit">Unit</span></label
            >
            <select class="form-select" id="unit" aria-label="Select Unit" data-i18n-attr="aria-label:unit-aria">
              <option value="" data-i18n="unit">Unit</option>
              <option value="pcs" data-i18n="pcs">Pcs</option>
              <option value="kg">Kg</option>
              <option value="g">G</option>
              <option value="L">L</option>
              <option value="ml">Ml</option>
              <option value="packs" data-i18n="packs">Packs</option>
              <option value="boxes" data-i18n="boxes">Boxes</option>
              <option value="bottles" data-i18n="bottles">Bottles</option>
              <option value="cans" data-i18n="cans">Cans</option>
              <option value="rolls" data-i18n="rolls">Rolls</option>
              <option value="bags" data-i18n="bags">Bags</option>
              <option value="units" data-i18n="units">Units</option>
              <option value="each" data-i18n="each">Each</option>
            </select>
          </div>
        </div>
        <div
          class="row w-100 d-flex justify-content-center align-items-center mb-3"
        >
          <div class="col-4 d-flex justify-content-center align-items-center">
            <button
              type="button"
              class="btn btn-sm px-0 filter-btn text-center"
              id="filterCategory"
              aria-label="Filter list by product category"
              aria-pressed="false"
              data-i18n-attr="aria-label:filter-category-aria"
            >
              <p
                class="d-flex text-center justify-content-center mb-0"
                data-i18n="filter-category"
              >
                Filter by category
              </p>
            </button>
          </div>
          <div class="col-4 d-flex justify-content-center align-items-center">
            <button
              type="button"
              class="btn btn-sm px-1 filter-btn text-center"
              id="filterName"
              aria-label="Filter list by product name"
              aria-pressed="false"
              data-i18n-attr="aria-label:filter-name-aria"
            >
              <p
                class="d-flex text-center justify-content-center mb-0"
                data-i18n="filter name"
              >
                Filter by name
              </p>
            </button>
          </div>
          <div class="col-4 d-flex justify-content-center align-items-center">
            <button
              type="button"
              class="btn btn-sm px-1 filter-btn text-center"
              id="filterAll"
              aria-label="Filter list by product category and product name"
              aria-pressed="false"
              data-i18n-attr="aria-label:filter-aria"
            >
              <p
                class="d-flex text-center justify-content-center mb-0"
                data-i18n="filter"
              >
                Filter by all
              </p>
            </button>
          </div>
        </div>
      </form>

      <section
        class="row col-12 col-md-8 col-lg-6 row-cols-2 row-cols-md-4 g-0 d-flex justify-content-center align-items-center"
      >
        <div class="col d-flex justify-content-center align-items-center">
          <button
            type="submit"
            class="btn btn-success my-3 border-3 list-btn text-center"
            id="submitBtn"
            aria-label="Add item to the list"
            data-i18n="add"
            data-i18n-attr="aria-label:add-aria"
          >
            Add
          </button>
        </div>
        <div class="col d-flex justify-content-center align-items-center">
          <button
            type="reset"
            class="btn btn-primary my-3 border-3 list-btn text-center"
            id="resetBtn"
            aria-label="Reset the list"
            data-i18n="reset"
            data-i18n-attr="aria-label:reset-aria"
          >
            Reset
          </button>
        </div>
        <div class="col d-flex justify-content-center align-items-center">
          <button
            type="button"
            class="btn btn-danger my-3 border-3 list-btn text-center"
            id="downloadBtn"
            aria-label="Download the list"
            data-i18n="download"
            data-i18n-attr="aria-label:download-aria"
          >
            Download
          </button>
        </div>
        <div class="col d-flex justify-content-center align-items-center">
          <button
            type="button"
            class="btn btn-info my-3 border-3 list-btn text-center"
            id="uploadBtn"
            aria-label="Load a list"
            data-i18n="load"
            data-i18n-attr="aria-label:load-aria"
          >
            Load
          </button>
        </div>
      </section>
      <section
        class="row col-12 col-md-8 col-lg-6 row-cols-2 row-cols-md-4 g-0 d-flex justify-content-center align-items-center"
      >
        <div class="col d-flex justify-content-center align-items-center">
          <button
            type="submit"
            class="btn btn-success my-3 border-3 list-btn text-center"
            id="saveBtn"
            aria-label="Save the item to your profile"
            data-i18n="save"
            data-i18n-attr="aria-label:save-aria"
          >
            Save
          </button>
        </div>
        <div class="col d-flex justify-content-center align-items-center">
          <button
            type="submit"
            class="btn btn-danger my-3 border-3 list-btn text-center"
            id="deleteBtn"
            aria-label="Delete all items on your profile"
            data-i18n="delete"
            data-i18n-attr="aria-label:delete-list-aria"
          >
            Delete
          </button>
        </div>
      </section>
      <div class="row d-flex text-center">
        <h3
          class="text-danger"
          id="fileInfo"
          role="alert"
          aria-live="polite"
        ></h3>
        <h3
          class="text-success"
          id="successMessage"
          role="alert"
          aria-live="polite"
        ></h3>
        <h3
          class="text-danger"
          id="errorMessage"
          role="alert"
          aria-live="assertive"
        ></h3>
        <h3 id="loadingMessage" role="alert" aria-live="assertive"></h3>
      </div>

      <section
        class="row col-12 col-md-8 col-lg-6 d-flex flex-column justify-content-center align-items-center"
      >
        <ul
          class="list-group my-2 col-12 col-md-8 px-0"
          id="displayList"
          aria-live="polite"
        ></ul>
      </section>
    </main>
    <p class="recaptcha-attribution text-center mb-3">
      This site is protected by reCAPTCHA and the Google
      <a
        href="https://policies.google.com/privacy"
        target="_blank"
        rel="noopener noreferrer"
        >Privacy Policy</a
      >
      and
      <a
        href="https://policies.google.com/terms"
        target="_blank"
        rel="noopener noreferrer"
        >Terms of Service</a
      >
      apply.
    </p>
    <div
      class="d-none d-lg-flex justify-content-left align-items-center fixed-bottom"
      id="time"
    >
      <div class="text-center d-flex mx-5 my-0">
        <h2 class="fs-5 mb-0" id="current-date"></h2>
      </div>
      <div class="text-center d-flex mx-5 my-0">
        <h2 class="fs-5 mb-0" id="current-time"></h2>
      </div>
    </div>
  </body>
</html>
