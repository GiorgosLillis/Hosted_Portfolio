<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
        background-color: #060642;
        color: azure;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 1.1rem;
        color: rgba(240, 255, 255, 0.8);
        max-width: 28rem;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.5rem;
        font-size: 1rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.15);
        color: azure;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 id="title">You're offline</h1>
    <p id="text">This page needs an internet connection to load. Check your connection and try again.</p>
    <button id="retry" type="button">Retry</button>
    <script>
      // Standalone on purpose: the service worker caches only this file, so the site's i18n bundle isn't available
      const texts = {
        en: { title: "You're offline", text: 'This page needs an internet connection to load. Check your connection and try again.', retry: 'Retry' },
        el: { title: 'Είστε εκτός σύνδεσης', text: 'Αυτή η σελίδα χρειάζεται σύνδεση στο διαδίκτυο για να φορτώσει. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.', retry: 'Δοκιμή ξανά' }
      };
      let lang = '';
      try {
        lang = localStorage.getItem('site-lang') || '';
      } catch (err) {}
      if (!texts[lang]) {
        lang = (navigator.language || '').slice(0, 2).toLowerCase();
      }
      if (!texts[lang]) {
        lang = 'en';
      }
      document.documentElement.lang = lang;
      document.title = texts[lang].title;
      document.getElementById('title').textContent = texts[lang].title;
      document.getElementById('text').textContent = texts[lang].text;
      document.getElementById('retry').textContent = texts[lang].retry;
      document.getElementById('retry').addEventListener('click', () => location.reload());
    </script>
  </body>
</html>
